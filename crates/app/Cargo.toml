[package]
name = "helixscan-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
helixscan-core = { path = "../core" }
helixscan-gpu = { path = "../gpu" }
serde.workspace = true
serde_json = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
uuid = { version = "1", features = ["v4"] }
async-stream = "0.3"
futures-core = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread"] }

[[test]]
name = "saved_report_browser"
path = "tests/saved_report_browser.rs"
required-features = ["browser-test"]

[features]
browser-test = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "helixscan"
path = "src/main.rs"

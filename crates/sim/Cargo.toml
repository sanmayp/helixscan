[package]
name = "helixscan-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
helixscan-panel = { path = "../panel" }
anyhow.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rayon = "1"

[lib]
path = "src/lib.rs"
[[bin]]
name = "helixscan-sim"
path = "src/main.rs"
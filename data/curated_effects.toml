# H0c. Alleles are on the GRCh38 forward strand used by data/panel.json.
# Dosage below is an effect-marker count, not a diagnosis or medication dose.
# Each row names ClinVar, PharmGKB/CPIC, or a verified key paper's PMID.
version = 1

[[effects]]
gene = "TCF7L2"
rsid = "rs7903146"
effect_allele = "T"
effect_direction = "higher type 2 diabetes risk"
plain_meaning = "T is the established TCF7L2 type 2 diabetes susceptibility allele; this common association is not deterministic."
source = "PMID:17463248 (Scott et al., Science 2007; rs7903146 T2D association)"

[[effects]]
gene = "FTO"
rsid = "rs9939609"
effect_allele = "A"
effect_direction = "higher type 2 diabetes risk mediated partly through BMI"
plain_meaning = "A is the established FTO obesity- and BMI-associated allele; it is associated with type 2 diabetes partly through body weight."
source = "PMID:17434869 (Frayling et al., Science 2007)"

[[effects]]
gene = "APOE"
rsid = "rs429358"
effect_allele = "C"
effect_direction = "APOE e4-defining allele, only with rs7412 C"
plain_meaning = "C together with rs7412 C defines APOE e4, an established Alzheimer's susceptibility haplotype; neither SNP is interpreted alone as an APOE genotype."
source = "ClinVar VCV000017864 (isolated APOE c.388T>C/rs429358 C allele); PharmGKB APOE allele definitions"

[[effects]]
gene = "APOE"
rsid = "rs7412"
effect_allele = "T"
effect_direction = "APOE e2-defining allele, only with rs429358 T; not an e4 allele"
plain_meaning = "T together with rs429358 T defines APOE e2. This allele does not define APOE e4; the two-site haplotype report is authoritative."
source = "ClinVar VCV000017848 (isolated APOE c.526C>T/rs7412 T allele); PMID:7920638 (Corder et al., Nature Genetics 1994, APOE e2)"

[[effects]]
gene = "HFE"
rsid = "rs1800562"
effect_allele = "A"
effect_direction = "HFE-related hereditary hemochromatosis-associated C282Y variant"
plain_meaning = "A encodes HFE C282Y. Clinical hemochromatosis has incomplete penetrance; genotype alone does not establish iron overload."
source = "ClinVar VCV000000009 (HFE c.845G>A, p.Cys282Tyr)"

[[effects]]
gene = "HFE"
rsid = "rs1799945"
effect_allele = "G"
effect_direction = "HFE-related H63D variant; lower penetrance than C282Y, including in compound genotypes"
plain_meaning = "G encodes HFE H63D. Its clinical significance depends on the other HFE allele and other findings; genotype alone is not iron overload."
source = "ClinVar VCV000000010 (HFE c.187C>G, p.His63Asp; record includes conflicting classifications)"

[[effects]]
gene = "F5"
rsid = "rs6025"
effect_allele = "T"
effect_direction = "factor V Leiden-associated increased thrombosis risk"
plain_meaning = "GRCh38 forward-strand T corresponds to F5 c.1601G>A (reverse-strand transcript; legacy c.1691G>A numbering), factor V Leiden. The other panel alternate, A, is not Leiden."
source = "ClinVar VCV000000642 (rs6025; F5 c.1601G>A, p.Arg534Gln); PMID:8164741 (Bertina et al., Nature 1994)"

[[effects]]
gene = "F2"
rsid = "rs1799963"
effect_allele = "A"
effect_direction = "higher thrombosis risk"
plain_meaning = "A is the F2 3-prime-UTR G20210A thrombosis-associated allele; carrying it does not mean a clot will occur."
source = "ClinVar VCV000013310 (F2 c.*97G>A, established risk allele/risk factor)"

[[effects]]
gene = "MCM6"
rsid = "rs4988235"
effect_allele = "A"
effect_direction = "lactase persistence"
plain_meaning = "GRCh38 G>A is LCT regulatory -13910C>T; A/T respectively are associated with lactase persistence, not a disease risk."
source = "ClinVar VCV000007685 (LCT c.-13907C>T, lactase persistence); PMID:11788828 (Enattah et al., Nature Genetics 2002)"

[[effects]]
gene = "ALDH2"
rsid = "rs671"
effect_allele = "A"
effect_direction = "reduced ALDH2 function, alcohol flushing"
plain_meaning = "A encodes ALDH2 E504K (historical E487K) and reduces enzyme activity, causing impaired acetaldehyde clearance and alcohol flushing."
source = "ClinVar VCV000018390 (ALDH2 c.1510G>A, p.Glu504Lys, reviewed by expert panel)"

[[effects]]
gene = "CYP2C19"
rsid = "rs4244285"
effect_allele = "A"
effect_direction = "CYP2C19 *2 no-function allele"
plain_meaning = "GRCh38 G>A is CYP2C19 c.681G>T on the reverse-strand transcript: *2, a no-function allele used with other alleles to infer metabolizer status."
source = "CPIC CYP2C19 allele functionality; PharmGKB rs4244285; ClinVar VCV001703261 (drug response)"

[[effects]]
gene = "CYP2C19"
rsid = "rs4986893"
effect_allele = "A"
effect_direction = "CYP2C19 *3 no-function allele"
plain_meaning = "A is CYP2C19 *3, a no-function allele; medication interpretation requires the full genotype, not this marker alone."
source = "CPIC CYP2C19 allele functionality; PharmGKB rs4986893; ClinVar VCV000016899 (drug response)"

[[effects]]
gene = "CYP2C19"
rsid = "rs12248560"
effect_allele = "T"
effect_direction = "CYP2C19 *17 increased-function allele"
plain_meaning = "T is the promoter variant defining CYP2C19 *17, an increased-function allele; metabolizer status depends on both haplotypes."
source = "CPIC CYP2C19 allele functionality; PharmGKB rs12248560 (CYP2C19 *17, c.-806C>T)"

[[effects]]
gene = "CYP2C9"
rsid = "rs1799853"
effect_allele = "T"
effect_direction = "CYP2C9 *2 decreased-function allele"
plain_meaning = "GRCh38 C>T corresponds to CYP2C9 c.430C>T, p.Arg144Cys (*2), a decreased-function allele."
source = "CPIC CYP2C9 allele functionality; PharmGKB rs1799853 and PharmVar CYP2C9*2"

[[effects]]
gene = "CYP2C9"
rsid = "rs1057910"
effect_allele = "C"
effect_direction = "CYP2C9 *3 decreased-function allele"
plain_meaning = "GRCh38 A>C corresponds to CYP2C9 c.1075A>C, p.Ile359Leu (*3), a decreased-function allele."
source = "CPIC CYP2C9 allele functionality; PharmGKB rs1057910 and PharmVar CYP2C9*3"

[[effects]]
gene = "SLCO1B1"
rsid = "rs4149056"
effect_allele = "C"
effect_direction = "reduced transporter function; higher simvastatin-associated muscle side-effect risk"
plain_meaning = "C is SLCO1B1 c.521T>C (Val174Ala), a decreased-function allele associated with simvastatin myopathy; effect size varies by genotype and medication."
source = "CPIC statin-associated muscle symptoms guideline (SLCO1B1 c.521T>C); PharmGKB rs4149056; ClinVar VCV000037346 (reviewed by expert panel)"

[[effects]]
gene = "CYP3A5"
rsid = "rs776746"
effect_allele = "T"
effect_direction = "CYP3A5 *1 normal-function allele; C is the *3 decreased-function allele"
plain_meaning = "GRCh38 T is CYP3A5 *1 (C on the reverse transcript is *3); *1 supports functional CYP3A5 expression. This is not a drug dose."
source = "CPIC tacrolimus guideline; PharmGKB rs776746 (CYP3A5 *3A/*1 alleles)"

[[effects]]
gene = "CFTR"
rsid = "rs113993960"
effect_allele = ""
effect_direction = "CFTR Phe508del pathogenic deletion"
plain_meaning = "The normalized three-base deletion (empty effect allele) is CFTR F508del. Carrier status depends on the genotype; this is not a diagnosis of cystic fibrosis."
source = "ClinVar VCV000007105 (isolated CFTR c.1521_1523del, p.Phe508del, pathogenic, practice guideline)"

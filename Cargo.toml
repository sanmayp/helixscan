[workspace]
members = ["crates/core", "crates/gpu", "crates/panel", "crates/sim"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
wgpu = "26"
toml = "0.8"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"